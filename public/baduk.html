<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 바둑 대국 - 보드게임 마스터</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap">
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="logo-area" id="btnLogo" onclick="location.href='index.html'" title="게임 로비로 이동">
      <div class="logo-icon">⚫</div>
      <h1 class="logo-title">AI 바둑 <span style="font-size: 0.8rem; color: var(--accent-gold); margin-left: 6px;">[로비로 나가기]</span></h1>
    </div>

    <div class="header-actions">
      <!-- Coin Display -->
      <div class="coin-badge-header" id="btnOpenShopModal" style="cursor: pointer;" title="스킨 상점 열기">
        <span>🪙</span>
        <span id="headerCoins">0</span>
      </div>

      <button class="btn btn-primary" id="btnOpenNewGameModal">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        새 대국
      </button>

      <!-- Guest Section -->
      <div id="guestSection" style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" id="btnOpenAuthModal">로그인 / 회원가입</button>
      </div>

      <!-- User Section -->
      <div id="userSection" style="display: none; align-items: center; gap: 10px;">
        <div class="user-badge" id="btnOpenProfileModal" style="cursor: pointer;" title="내 정보">
          <div class="user-avatar" id="headerAvatar">U</div>
          <span class="user-name" id="headerUserName">사용자</span>
          <span class="user-record" id="headerUserRecord">0승 0패</span>
        </div>
        <button class="btn btn-secondary" id="btnOpenHistoryModal" title="대국 전적">전적</button>
        <button class="btn btn-icon" id="btnLogout" title="로그아웃">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Game Workspace -->
  <main class="main-container">
    <!-- Board Section -->
    <section class="board-section">
      <div class="board-wrapper">
        <canvas id="badukCanvas" width="580" height="580"></canvas>
      </div>
    </section>

    <!-- Side Control Panel -->
    <aside class="side-panel">
      <!-- Match Info Card -->
      <div class="card">
        <div class="match-status-header">
          <div class="match-tag">AI 대국</div>
          <div class="diff-badge" id="currentDiffBadge">보통</div>
        </div>

        <!-- Players Status -->
        <div class="players-box">
          <div class="player-row active" id="playerRowBlack">
            <div class="player-avatar black">
              <span class="stone-icon black"></span>
            </div>
            <div class="player-info">
              <div class="player-name" id="nameBlack">나 (흑)</div>
              <div class="player-role" id="roleBlack">선착</div>
            </div>
            <div class="player-captures">
              <span class="cap-label">따낸 돌</span>
              <span class="cap-val" id="capturesBlack">0</span>
            </div>
          </div>

          <div class="player-row" id="playerRowWhite">
            <div class="player-avatar white">
              <span class="stone-icon white"></span>
            </div>
            <div class="player-info">
              <div class="player-name" id="nameWhite">AI 바둑 (백)</div>
              <div class="player-role" id="roleWhite">덤 6.5집</div>
            </div>
            <div class="player-captures">
              <span class="cap-label">따낸 돌</span>
              <span class="cap-val" id="capturesWhite">0</span>
            </div>
          </div>
        </div>

        <!-- Turn Notice Banner -->
        <div class="turn-banner" id="turnStatusBanner">
          <span class="turn-dot"></span>
          <span id="turnStatusText">내 차례입니다. 착수해주세요.</span>
        </div>
      </div>

      <!-- In-Game Action Buttons -->
      <div class="card actions-card">
        <div class="action-grid">
          <button class="btn btn-secondary" id="btnPass">
            <span>착수 포기 (Pass)</span>
          </button>
          <button class="btn btn-secondary" id="btnUndo">
            <span>무르기 (Undo)</span>
          </button>
          <button class="btn btn-secondary" id="btnEstimate">
            <span>형세 판단</span>
          </button>
          <button class="btn btn-danger" id="btnResign">
            <span>기권하기</span>
          </button>
        </div>
      </div>

      <!-- Settings / Display toggles -->
      <div class="card options-card">
        <label class="toggle-label">
          <span>수순(착수 번호) 표시</span>
          <input type="checkbox" id="chkShowMoveNumbers">
        </label>
        <label class="toggle-label">
          <span>착수 효과음</span>
          <input type="checkbox" id="chkSound" checked>
        </label>
      </div>
    </aside>
  </main>

  <!-- MODAL: New Game -->
  <div class="modal-overlay" id="modalNewGame">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">새 대국 설정</h3>
        <button class="modal-close" onclick="document.getElementById('modalNewGame').classList.remove('active')">&times;</button>
      </div>

      <div class="setting-group">
        <label class="setting-title">AI 난이도</label>
        <div class="segmented-control" id="diffSelection">
          <button class="seg-btn" data-val="easy">쉬움 (+100🪙)</button>
          <button class="seg-btn active" data-val="normal">보통 (+300🪙)</button>
          <button class="seg-btn" data-val="hard">어려움 (+800🪙)</button>
          <button class="seg-btn" data-val="max">최대 (+2000🪙)</button>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-title">바둑판 크기</label>
        <div class="segmented-control" id="sizeSelection">
          <button class="seg-btn" data-val="9">9×9 (입문/속기)</button>
          <button class="seg-btn" data-val="13">13×13 (중급)</button>
          <button class="seg-btn active" data-val="19">19×19 (정규 규격)</button>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-title">착수 흑/백 선택</label>
        <div class="segmented-control" id="colorSelection">
          <button class="seg-btn active" data-val="1">흑 (선착)</button>
          <button class="seg-btn" data-val="2">백 (후착 / 덤 6.5)</button>
        </div>
      </div>

      <button class="btn btn-primary" id="btnStartGame" style="width: 100%; justify-content: center; margin-top: 10px; padding: 12px;">대국 시작하기</button>
    </div>
  </div>

  <!-- MODAL: Auth (Login/Register) -->
  <div class="modal-overlay" id="modalAuth">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">로그인 / 회원가입</h3>
        <button class="modal-close" onclick="document.getElementById('modalAuth').classList.remove('active')">&times;</button>
      </div>

      <div class="tab-headers">
        <button class="tab-btn active" id="tabBtnLogin">로그인</button>
        <button class="tab-btn" id="tabBtnRegister">회원가입</button>
      </div>

      <form id="formLogin">
        <div class="form-group">
          <label class="form-label">아이디</label>
          <input type="text" class="form-input" id="loginUsername" placeholder="아이디 입력" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="비밀번호 입력" required autocomplete="current-password">
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; padding: 12px;">로그인</button>
      </form>

      <form id="formRegister" style="display: none;">
        <div class="form-group">
          <label class="form-label">아이디</label>
          <input type="text" class="form-input" id="regUsername" placeholder="3자 이상 영문/숫자" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">닉네임</label>
          <input type="text" class="form-input" id="regNickname" placeholder="대국에 표시될 이름">
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="password" class="form-input" id="regPassword" placeholder="4자 이상 입력" required autocomplete="new-password">
        </div>
        <div class="form-error" id="regError"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; padding: 12px;">회원가입 완료</button>
      </form>
    </div>
  </div>

  <!-- MODAL: Game Result -->
  <div class="modal-overlay" id="modalResult">
    <div class="modal-card" style="text-align: center;">
      <div style="font-size: 3rem; margin-bottom: 8px;" id="resultEmoji">🎉</div>
      <h3 class="modal-title" id="resultTitle" style="font-size: 1.5rem; margin-bottom: 8px;">대국 종료</h3>
      <p id="resultDetail" style="color: var(--text-muted); font-size: 1rem; line-height: 1.5; margin-bottom: 20px;">결과 설명</p>

      <div id="resultScoreBreakdown" style="display: none; background: rgba(0,0,0,0.25); border-radius: 8px; padding: 12px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-around; font-size: 0.95rem;">
          <div>흑: <strong id="resBlackTotal">0</strong>집</div>
          <div>백: <strong id="resWhiteTotal">0</strong>집</div>
        </div>
      </div>

      <div id="resultCoinReward" style="margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; color: var(--accent-gold);">
        🪙 <span id="resEarnedCoins">+300</span> 코인 획득!
      </div>

      <button class="btn btn-primary" id="btnResultNewGame" style="width: 100%; justify-content: center; padding: 12px;">새 대국 시작</button>
    </div>
  </div>

  <!-- MODAL: Match History -->
  <div class="modal-overlay" id="modalHistory">
    <div class="modal-card" style="max-width: 520px;">
      <div class="modal-header">
        <h3 class="modal-title">내 대국 전적</h3>
        <button class="modal-close" onclick="document.getElementById('modalHistory').classList.remove('active')">&times;</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; text-align: center;">
        <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px;">
          <div style="color: var(--text-muted); font-size: 0.8rem;">총 대국</div>
          <div id="statTotalGames" style="font-size: 1.25rem; font-weight: bold; margin-top: 4px;">0전</div>
        </div>
        <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px;">
          <div style="color: var(--text-muted); font-size: 0.8rem;">승 / 패</div>
          <div id="statWinLoss" style="font-size: 1.25rem; font-weight: bold; margin-top: 4px;">0승 0패</div>
        </div>
        <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px;">
          <div style="color: var(--text-muted); font-size: 0.8rem;">승률</div>
          <div id="statWinRate" style="font-size: 1.25rem; font-weight: bold; color: var(--accent-gold); margin-top: 4px;">0%</div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 20px; font-size: 0.78rem; text-align: center;">
        <div style="background: rgba(255,255,255,0.02); padding: 8px 4px; border-radius: 6px;">
          <div style="color: #4ade80; font-weight: bold;">쉬움</div>
          <div id="statDiffEasy" style="margin-top: 4px;">0승 0패</div>
        </div>
        <div style="background: rgba(255,255,255,0.02); padding: 8px 4px; border-radius: 6px;">
          <div style="color: #facc15; font-weight: bold;">보통</div>
          <div id="statDiffNormal" style="margin-top: 4px;">0승 0패</div>
        </div>
        <div style="background: rgba(255,255,255,0.02); padding: 8px 4px; border-radius: 6px;">
          <div style="color: #f87171; font-weight: bold;">어려움</div>
          <div id="statDiffHard" style="margin-top: 4px;">0승 0패</div>
        </div>
        <div style="background: rgba(255,255,255,0.02); padding: 8px 4px; border-radius: 6px;">
          <div style="color: #c084fc; font-weight: bold;">최대</div>
          <div id="statDiffMax" style="margin-top: 4px;">0승 0패</div>
        </div>
      </div>

      <h4 style="font-size: 0.95rem; margin-bottom: 10px;">최근 대국 기록</h4>
      <div class="history-list" id="historyListContainer">
        <div style="color: var(--text-muted); text-align: center; padding: 20px;">대국 기록이 없습니다.</div>
      </div>
    </div>
  </div>

  <!-- MODAL: Shop -->
  <div class="modal-overlay" id="modalShop">
    <div class="modal-card" style="max-width: 600px;">
      <div class="modal-header">
        <h3 class="modal-title">스킨 상점</h3>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="coin-badge-header">
            <span>🪙</span>
            <span id="shopMyCoins">0</span>
          </div>
          <button class="modal-close" onclick="document.getElementById('modalShop').classList.remove('active')">&times;</button>
        </div>
      </div>

      <div class="tab-headers">
        <button class="tab-btn active" id="tabShopBoards">바둑판 스킨</button>
        <button class="tab-btn" id="tabShopStones">바둑돌 스킨</button>
      </div>

      <div id="shopBoardsContainer" class="shop-grid"></div>
      <div id="shopStonesContainer" class="shop-grid" style="display: none;"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/baduk-engine.js"></script>
  <script src="js/baduk-ai.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
