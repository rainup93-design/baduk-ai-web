  <script src="js/auth.js"></script>
  <script>
    // Auth integration
    async function init() {
      await authManager.checkAuth();
      updateHubUI();
    }

    function updateHubUI() {
      const user = authManager.user;
      const coins = authManager.getCoins();
      document.getElementById('hubCoins').textContent = coins;

      if (user) {
        document.getElementById('hubGuestSection').style.display = 'none';
        document.getElementById('hubUserSection').style.display = 'flex';
        const nick = user.nickname || user.username;
        document.getElementById('hubAvatar').textContent = nick[0].toUpperCase();
        document.getElementById('hubUserName').textContent = nick;
      } else {
        document.getElementById('hubGuestSection').style.display = 'block';
        document.getElementById('hubUserSection').style.display = 'none';
      }
    }

    authManager.onUserChange(updateHubUI);

    function selectGame(gameId) {
      window.location.href = `${gameId}.html`;
    }

    document.getElementById('hubBtnAuth').addEventListener('click', () => {
      document.getElementById('hubModalAuth').classList.add('active');
    });

    document.getElementById('hubBtnLogout').addEventListener('click', async () => {
      if (confirm('濡쒓렇?꾩썐 ?섏떆寃좎뒿?덇퉴?')) {
        await authManager.logout();
        updateHubUI();
      }
    });

    document.getElementById('hubModalAuth').addEventListener('click', (e) => {
      if (e.target === document.getElementById('hubModalAuth')) {
        closeHubModal('hubModalAuth');
      }
    });

    function closeHubModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function switchAuthTab(tab) {
      document.getElementById('hubTabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('hubTabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('hubFormLogin').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('hubFormRegister').style.display = tab === 'register' ? 'block' : 'none';
    }

    document.getElementById('hubFormLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('hubLoginError').textContent = '';
      try {
        await authManager.login(
          document.getElementById('hubLoginUsername').value.trim(),
          document.getElementById('hubLoginPassword').value
        );
        closeHubModal('hubModalAuth');
        updateHubUI();
      } catch (err) {
        document.getElementById('hubLoginError').textContent = err.message;
      }
    });

    document.getElementById('hubFormRegister').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('hubRegError').textContent = '';
      try {
        await authManager.register(
          document.getElementById('hubRegUsername').value.trim(),
          document.getElementById('hubRegPassword').value,
          document.getElementById('hubRegNickname').value.trim()
        );
        closeHubModal('hubModalAuth');
        updateHubUI();
      } catch (err) {
        document.getElementById('hubRegError').textContent = err.message;
      }
    });

    init();
  </script>
